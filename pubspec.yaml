name: tsetse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_inner_shadow: ^0.0.1
  pin_code_fields: ^8.0.1
  image_picker: ^1.2.1
  permission_handler: ^12.0.1

  # Firebase
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0

  # SVG support
  flutter_svg: ^2.2.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter Gen (correct name!)
  flutter_gen_runner: ^5.5.0
  
  # Required for running code generation
  build_runner: ^2.4.8

  flutter_lints: ^5.0.0

# Flutter Gen configuration
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
